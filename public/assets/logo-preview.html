<!DOCTYPE html>
<html>
<head><title>SmartEdu Logo Preview</title>
<style>
body { background: #0a0e1a; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
.preview { display: flex; gap: 40px; align-items: center; }
.logo-container { text-align: center; }
.logo-container div { margin-bottom: 10px; }
h2 { color: #00d4ff; margin-top: 20px; }
.dark { background: #0a0e1a; padding: 20px; border-radius: 16px; }
.light { background: #fff; padding: 20px; border-radius: 16px; }
</style>
</head>
<body>
<div class='preview'>
  <div class='dark'>
    <div style='font-size:72px;line-height:1;'><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- 渐变色 -->
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0.9" />
    </linearGradient>
    <!-- 发光效果 -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景圆形 -->
  <circle cx="50" cy="50" r="46" fill="url(#logoGrad)" opacity="0.15" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" opacity="0.6" />
  
  <!-- 毕业帽主体 -->
  <g filter="url(#glow)">
    <!-- 帽顶菱形 -->
    <polygon points="50,18 78,32 50,46 22,32" fill="url(#capGrad)" />
    <!-- 帽身边缘 -->
    <polygon points="50,18 78,32 50,46 22,32" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.8" />
    
    <!-- 帽身圆柱 -->
    <rect x="32" y="44" width="36" height="22" rx="2" fill="url(#capGrad)" opacity="0.85" />
    <rect x="32" y="44" width="36" height="22" rx="2" fill="none" stroke="#00d4ff" stroke-width="0.8" opacity="0.6" />
    
    <!-- 帽穗 -->
    <line x1="50" y1="32" x2="50" y2="50" stroke="#00d4ff" stroke-width="1.5" opacity="0.8" />
    <circle cx="50" cy="52" r="3" fill="#00d4ff" />
    
    <!-- 电路节点装饰 -->
    <circle cx="22" cy="32" r="2" fill="#00d4ff" opacity="0.7" />
    <circle cx="78" cy="32" r="2" fill="#00d4ff" opacity="0.7" />
    <circle cx="50" cy="46" r="2" fill="#00d4ff" opacity="0.7" />
  </g>
  
  <!-- 科技线条 -->
  <path d="M 15 50 L 25 50" stroke="#00d4ff" stroke-width="1" opacity="0.4" />
  <path d="M 75 50 L 85 50" stroke="#00d4ff" stroke-width="1" opacity="0.4" />
  <path d="M 50 70 L 50 82" stroke="#00d4ff" stroke-width="1" opacity="0.4" />
  
  <!-- 数据点装饰 -->
  <circle cx="15" cy="50" r="1.5" fill="#00d4ff" opacity="0.5" />
  <circle cx="85" cy="50" r="1.5" fill="#00d4ff" opacity="0.5" />
  <circle cx="50" cy="82" r="1.5" fill="#00d4ff" opacity="0.5" />
</svg>
</div>
    <h2>深色背景</h2>
  </div>
  <div class='light'>
    <div style='font-size:72px;line-height:1;'><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">

  <circle cx="85" cy="50" r="1.5" fill="#00d4ff" opacity="0.5" />

</div>
    <h2>浅色背景</h2>
  </div>
</div>
</body></html>
