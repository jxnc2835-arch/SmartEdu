<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>API测试</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; }
    .test { background: white; padding: 15px; margin: 10px 0; border-radius: 8px; }
    .success { color: green; }
    .error { color: red; }
    pre { background: #f8f8f8; padding: 10px; border-radius: 4px; overflow-x: auto; }
  </style>
</head>
<body>
  <h1>查寝系统API测试</h1>
  
  <div id="loading" class="test">⏳ 正在测试API...</div>
  
  <script>
    async function test() {
      const loading = document.getElementById('loading');
      
      try {
        // 测试1：获取今天的记录
        const today = '2026-06-29';
        const response = await fetch(`/api/records?date=${today}&type=checkin`);
        const json = await response.json();
        
        loading.className = 'test success';
        loading.innerHTML = `
          <h2>✅ 测试通过</h2>
          <p>日期: ${today}</p>
          <p>记录数: <strong>${json.data?.length || 0}</strong></p>
          <h3>前3条记录:</h3>
          <pre>${JSON.stringify(json.data?.slice(0, 3), null, 2)}</pre>
        `;
        
        // 测试2：获取所有日期的记录
        const allResponse = await fetch('/api/records?type=checkin');
        const allJson = await allResponse.json();
        
        const div = document.createElement('div');
        div.className = 'test success';
        div.innerHTML = `
          <h2>📊 统计信息</h2>
          <p>总查寝记录数: <strong>${allJson.data?.length || 0}</strong></p>
          <p>不同日期数: <strong>${new Set(allJson.data?.map(d => d.date)).size}</strong></p>
          <p>日期范围: ${new Set(allJson.data?.map(d => d.date)).values().next().value} ~ ${[...new Set(allJson.data?.map(d => d.date))].sort().pop()}</p>
        `;
        document.body.appendChild(div);
        
      } catch (error) {
        loading.className = 'test error';
        const esc=s=>{if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#x27;');};
        loading.innerHTML = `<h2>❌ 测试失败</h2><p>${esc(error.message)}</p>`;
      }
    }
    
    test();
  </script>
</body>
</html>
